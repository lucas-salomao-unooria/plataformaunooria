# Plataforma Unooria — a MESMA stack do docker-compose.yml, mas em modo
# desenvolvimento: o código vem do host por bind mount e cada serviço roda o
# seu watcher. Editar um arquivo no editor = container atualizado, sem
# `docker compose build` e sem `up` de novo.
#
#   pnpm docker:dev            # sobe tudo (== docker compose -f docker-compose.dev.yml up -d)
#   pnpm docker:dev:logs       # acompanha
#   pnpm docker:dev:down       # desce
#   pnpm docker:dev:deps       # reinstala node_modules (depois de mexer no package.json/lockfile)
#
# Sobe, tudo com hot reload:
#   pg      Postgres da plataforma (5432, banco `unooria`)
#   api     NestJS em `nest start --watch` (3001)
#   hub     Next.js em `next dev` (3000)
#   exp08ef1b  Vite da Instanooria (5173)
#   exp04ef1b  Vite do Jornal da Escola, a redação da Unooria (5174)
#   app-90  Vite do plano de aula, ferramenta do professor (5175)
#   app-92  Vite do planejamento de ensino, ferramenta do professor (5180)
#   app-70  Vite da Vila do Lume, transversal (5177 — a 5176 é da app-91)
#   app-91  Vite do check-in de bem-estar, ferramenta do professor (5176)
#   exp02em1b  Vite de O Efeito Amplificador, UnooriaAI + Unoovista (5178)
#   exp07ef1b  Vite de A Seleção, o clone de rede social de fotos (5179)
#   exp06ef2b  Vite de O Rastro do Boato, o clone de mensageiro (5181)
#   exp08ef4b  Vite de O Manifesto da IA, o clone do assistente (5182)
#   exp01ef1b  Vite de O Que a Foto Conta, o clone do mural (5183)
#   exp05ef1b  Vite de Quem mandou isso?, o clone do mensageiro (5184)
#   exp06ef1b  Vite de O Júri Estadual de Projetos, o clone de rede social de fotos (5185)
#   exp03ef1b  Vite de Nina e a Notícia que Desapareceu, o jornal Unoojornal (5189)
#   exp02em1b-v0  Vite da Missão Tempestade, a VERSÃO ANTERIOR da 2ª série EM (5186,
#              ADR-181) — só no profile `anteriores`: `docker compose --profile anteriores …`
#
# As experiências ENTRAM aqui — ao contrário do compose de produção, onde elas
# não existem porque em produção são bundles estáticos num bucket, não serviços.
# Em dev elas são dev servers do Vite, e as portas são as MESMAS de
# `apps/hub/lib/experiencias-dev.ts` (o hub monta o iframe a partir desse mapa,
# e a origin do postMessage sai da mesma URL).
#
# Mesmo `name:` do compose de produção de propósito: os dois descrevem a mesma
# stack nas mesmas portas, então trocar de um para o outro RECRIA os serviços em
# vez de subir uma segunda cópia que brigaria pelas portas (use
# `--remove-orphans` ao trocar, para os containers das exps saírem junto). O
# volume do Postgres é o mesmo (`unooria-plataforma_pgdata`): o banco não se
# perde na troca.
#
# O IdP (WSO2) continua em `wso2/docker-compose.yml` — lá o equivalente disto é
# `docker compose -f wso2/docker-compose.yml watch` (ver wso2/README.md).
name: unooria-plataforma

# ── Volumes de código, compartilhados por todos os serviços node ──────────────
#
# O repo inteiro entra por bind mount; por cima dele, um volume para CADA
# `node_modules` do workspace. Isso não é zelo: o `node_modules` do host é
# binário de macOS (esbuild, sharp, engine do Prisma) e não roda no Linux do
# container — e o inverso é pior, o install do container sobrescreveria com
# binários Linux o `node_modules` que o `pnpm dev` do host usa. Os dois mundos
# ficam isolados e cada um instala o seu.
x-fonte: &fonte
  - .:/repo
  - nm-raiz:/repo/node_modules
  - nm-api:/repo/apps/api/node_modules
  - nm-hub:/repo/apps/hub/node_modules
  - nm-sdk:/repo/packages/sdk/node_modules
  - nm-ui:/repo/packages/ui/node_modules
  - nm-exp08ef1b:/repo/apps/experiencias/exp08ef1b/node_modules
  - nm-exp04ef1b:/repo/apps/experiencias/exp04ef1b/node_modules
  - nm-app90:/repo/apps/experiencias/app-90-plano-de-aula/node_modules
  - nm-app70:/repo/apps/experiencias/app-70-vila-do-lume/node_modules
  - nm-app91:/repo/apps/experiencias/app-91-bem-estar/node_modules
  - nm-exp02em1b:/repo/apps/experiencias/exp02em1b/node_modules
  - nm-exp02em1b-v0:/repo/apps/experiencias/exp02em1b-v0/node_modules
  - nm-exp07ef1b:/repo/apps/experiencias/exp07ef1b/node_modules
  - nm-exp06ef2b:/repo/apps/experiencias/exp06ef2b/node_modules
  - nm-exp05ef1b:/repo/apps/experiencias/exp05ef1b/node_modules
  - nm-exp06ef1b:/repo/apps/experiencias/exp06ef1b/node_modules
  - nm-exp03ef1b:/repo/apps/experiencias/exp03ef1b/node_modules
  - nm-exp-template:/repo/apps/experiencias/_template/node_modules
  - pnpm-store:/pnpm-store
  # Artefatos de build também em volume, por dois motivos: não competir com o
  # `.next`/`dist` que o `pnpm dev` do host escreve (sintoma clássico do
  # conflito: tela branca / CSS bugado) e escrever no fs do container, que no
  # macOS é bem mais rápido que o bind mount.
  - hub-next:/repo/apps/hub/.next
  - api-dist:/repo/apps/api/dist
  # Os `.env` do HOST não podem valer dentro do container: eles apontam para
  # `localhost` (que aqui é o próprio container) enquanto a rede do compose usa
  # nomes de serviço. O `.dockerignore` cuida disso nas imagens de produção, mas
  # não vale para bind mount — então cada um é coberto por um arquivo vazio.
  - ./docker/env-vazio:/repo/apps/api/.env:ro
  - ./docker/env-vazio:/repo/apps/api/.env.local:ro
  - ./docker/env-vazio:/repo/apps/hub/.env:ro
  - ./docker/env-vazio:/repo/apps/hub/.env.local:ro
  - ./docker/env-vazio:/repo/apps/hub/.env.development:ro
  - ./docker/env-vazio:/repo/apps/hub/.env.development.local:ro
  # Credencial ADC do host, para a api falar com o Vertex de dentro do
  # container (`GOOGLE_APPLICATION_CREDENTIALS` abaixo). Só a api usa, mas o
  # mount fica aqui porque YAML não mescla listas: `volumes:` no serviço
  # SUBSTITUI esta lista inteira em vez de acrescentar. Somente leitura.
  # Rode `gcloud auth application-default login` ANTES do primeiro
  # `pnpm docker:dev`: se o arquivo não existir, o Docker cria um DIRETÓRIO
  # com esse nome e o login depois falha.
  - ${ADC_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}:/adc/application_default_credentials.json:ro

x-dev: &dev
  image: unooria-dev:latest
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes: *fonte
  # Escape hatch dos watchers. MEDIDO nesta máquina (Docker Desktop 29 no
  # macOS): os três recompilam sem polling — os eventos de inotify atravessam o
  # bind mount, tanto para o tsc do Nest quanto para o chokidar do Vite e o
  # webpack do Next. Se um dia salvar arquivo e nada recompilar (Docker Desktop
  # mais antigo, gRPC-FUSE em vez de VirtioFS), suba com `DEV_POLLING=1`.
  environment: &dev-env
    WATCHPACK_POLLING: ${DEV_POLLING:-}
    CHOKIDAR_USEPOLLING: ${DEV_POLLING:-}
    VITE_USE_POLLING: ${DEV_POLLING:-}

services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: unooria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U postgres -d unooria"]
      interval: 5s
      timeout: 5s
      retries: 24

  # `pnpm install` UMA vez, nos volumes que os outros serviços compartilham.
  # Um serviço só para isso (e não um entrypoint em cada) porque seis installs
  # simultâneos no mesmo `node_modules` corrompem a árvore: aqui todo mundo
  # espera pelo `service_completed_successfully`. Idempotente e rápido quando
  # nada mudou; depois de mexer em dependência, `pnpm docker:dev:deps`.
  deps:
    <<: *dev
    command: >
      sh -c "pnpm install --frozen-lockfile &&
             pnpm --filter @edu/api exec prisma generate"
    restart: "no"

  # Migrations + seed antes da api subir, como no compose de produção — mas a
  # partir do FONTE (ts-node), não de `dist/`. Os três passos são idempotentes.
  migrate:
    <<: *dev
    working_dir: /repo/apps/api
    command: >
      sh -c "pnpm exec prisma migrate deploy &&
             pnpm exec ts-node --transpile-only prisma/seed.ts &&
             pnpm exec ts-node --transpile-only prisma/semear-demo.ts"
    environment:
      <<: *dev-env
      DATABASE_URL: postgresql://postgres:pass@pg:5432/unooria
      # Ver o comentário gêmeo no docker-compose.yml: a senha do seed é do
      # AMBIENTE, e o default de dev vive aqui, não no prisma/seed.ts.
      SEED_SENHA: ${SEED_SENHA:-unooria123}
    depends_on:
      pg:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *dev
    working_dir: /repo/apps/api
    command: pnpm exec nest start --watch
    environment:
      <<: *dev-env
      DATABASE_URL: postgresql://postgres:pass@pg:5432/unooria
      # PERFIL PORTÁTIL: de quem esta instalação aceita conferir assinatura.
      # A forma `origem=urlDoJwks` existe porque o `emissor.hub` do documento é o
      # endereço do NAVEGADOR — mesma distinção de EXP_INTERNAL_HOST: de dentro
      # deste contêiner, `localhost:3000` é a própria api, e o hub é `hub:3000`.
      # Sem isto o caminho criptográfico (documento adulterado = RECUSADO) não
      # teria como ser exercido em dev. http só é aceito fora de produção.
      PORTABILIDADE_EMISSORES: ${PORTABILIDADE_EMISSORES:-http://localhost:3000=http://hub:3000/.well-known/jwks.json}
      # O emissor dos tokens é o HUB: o `issuer` é a origem que o BROWSER usa,
      # mas o JWKS é buscado pela rede do compose (nome do serviço).
      OIDC_ISSUER: http://localhost:3000
      OIDC_JWKS_URI: http://hub:3000/.well-known/jwks.json
      OIDC_AUDIENCE: plataforma-api
      # IA: `vertex` exige VERTEX_PROJECT_ID (o boot recusa sem ele) e a
      # credencial ADC montada acima — a mesma cadeia do Cloud Run, onde a
      # credencial é a service account do serviço e nada disto é preciso.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      VERTEX_MODEL: ${VERTEX_MODEL:-gemini-3.6-flash}
      VERTEX_MODEL_LONGO: ${VERTEX_MODEL_LONGO:-gemini-3.6-flash}
      VERTEX_IMAGE_MODEL: ${VERTEX_IMAGE_MODEL:-gemini-3.1-flash-image}
      VERTEX_TTS_MODEL: ${VERTEX_TTS_MODEL:-gemini-2.5-flash-tts}
      VERTEX_THINKING_BUDGET: ${VERTEX_THINKING_BUDGET:-0}
      # Agente de IA do professor (docs/regras/agente-professor.md). `mock` é o
      # turno enlatado da suíte e2e; `local` fala com o shim Python rodando NO
      # HOST (`cd apps/agente-professor && uv run python -m agente_professor.shim`,
      # porta 8090), que expõe o mesmo contrato do Agent Engine.
      AGENTE_PROFESSOR_MODO: ${AGENTE_PROFESSOR_MODO:-mock}
      AGENTE_PROFESSOR_URL_LOCAL: ${AGENTE_PROFESSOR_URL_LOCAL:-http://host.docker.internal:8090}
      # Ajuda com avatar (ADR-132). Vazias = a Ajuda responde 503 e nada mais muda.
      # O vendor precisa ALCANÇAR a api (/ajuda/llm): em dev local, só com túnel.
      LIVEAVATAR_API_KEY: ${LIVEAVATAR_API_KEY:-}
      LIVEAVATAR_CONTEXT_ID: ${LIVEAVATAR_CONTEXT_ID:-}
      LIVEAVATAR_LLM_CONFIG_ID: ${LIVEAVATAR_LLM_CONFIG_ID:-}
      LIVEAVATAR_SANDBOX: ${LIVEAVATAR_SANDBOX:-1}
      AJUDA_LLM_SEGREDO: ${AJUDA_LLM_SEGREDO:-}
      AJUDA_SESSAO_CHAVE: ${AJUDA_SESSAO_CHAVE:-}
      GOOGLE_APPLICATION_CREDENTIALS: /adc/application_default_credentials.json
      # A quota diaria de IA por perfil NAO e env desde a ADR-105: e a tabela
      # `ia_quotas`, semeada pela migration e editada pelo admin em
      # /unooria/uso-de-ia.
      ASSETS_DRIVER: local
      ASSETS_LOCAL_DIR: /repo/apps/api/storage
      ASSETS_PUBLIC_URL: http://localhost:3001/assets
      PLANOS_DRIVER: local
      PLANOS_LOCAL_DIR: /repo/apps/api/storage-privado
      # Vazio = `POST /planos/referencias` desligado (503). Preencha para
      # importar currículo/material didático com scripts/importar-referencias-plano.mjs.
      PLANOS_IMPORT_TOKEN: ${PLANOS_IMPORT_TOKEN:-}
      TELEMETRIA_TOPIC: ""
      # Observabilidade: log em `pretty` no terminal (NODE_ENV≠production); nada
      # sai para o GCP sem GCP_PROJECT_ID/OBS_TRACE_RATIO, que ficam vazios aqui.
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      OBS_TRACE_RATIO: ${OBS_TRACE_RATIO:-0}
      OBS_DEBUG: ${OBS_DEBUG:-0}
      # Toda porta de exp entra no CORS: sem a :5175 o plano de aula embedado
      # morre com "Failed to fetch", sem a :5176 o check-in de bem-estar e sem
      # a :5177 a Vila do Lume não abre nem conclui a partida.
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://localhost:5180,http://localhost:5181,http://localhost:5182,http://localhost:5183,http://localhost:5184,http://localhost:5185,http://localhost:5186,http://localhost:5187,http://localhost:5188,http://localhost:5189
      # O FUSO da plataforma inteira (ADR-99). Ausente = America/Sao_Paulo.
      # O MESMO valor vai para o hub abaixo: 1 contrato = 1 stack, e api e hub
      # que discordem do fuso devolvem o defeito da ADR-98 — entre as 21h e a
      # meia-noite os dois renderizam DIAS diferentes. Aqui um valor inválido
      # derruba o boot (Zod, `config/env.ts`); no hub ele cai no padrão.
      FUSO_DA_PLATAFORMA: ${FUSO_DA_PLATAFORMA:-America/Sao_Paulo}
      # Documentação OpenAPI em http://localhost:3001/docs (Swagger UI).
      #
      # LIGADA por default em dev, com credencial de dev à vista: sem as duas
      # variáveis a rota nem é montada, e um /docs que só funciona para quem
      # descobriu que precisa exportar env é um /docs que ninguém abre. Em
      # produção estas variáveis vêm do Secret Manager (docs/INFRA.md) e a senha
      # NÃO é esta — o boot exige 16 caracteres, e as duas andam juntas.
      SWAGGER_USUARIO: ${SWAGGER_USUARIO:-docs}
      SWAGGER_SENHA: ${SWAGGER_SENHA:-unooria-docs-local}
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      pg:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      # A primeira compilação do watch leva bem mais que um boot de imagem
      # pronta; sem isto o compose declararia a api doente antes de ela subir.
      start_period: 90s

  hub:
    <<: *dev
    working_dir: /repo/apps/hub
    # `-H 0.0.0.0`: o default do next dev escuta em todas as interfaces, mas
    # explicitar deixa claro que quem acessa está FORA do container.
    command: pnpm exec next dev -p 3000 -H 0.0.0.0
    environment:
      <<: *dev-env
      API_INTERNAL_URL: http://api:3001
      # Observabilidade: mesmo gate da api; OBS_DEBUG=1 imprime os spans do Next no console.
      OBS_TRACE_RATIO: ${OBS_TRACE_RATIO:-0}
      OBS_DEBUG: ${OBS_DEBUG:-0}
      # Fração de sessões das experiências com OpenTelemetry Web (config.obs do hub:init). 1 = todas, em dev.
      OBS_TRACE_RATIO_CLIENTE: ${OBS_TRACE_RATIO_CLIENTE:-0}
      # O mesmo fuso da api (ADR-99). O hub o escreve num <meta> do layout raiz
      # e de lá ele chega ao navegador e, pelo config do hub:init, a toda
      # experiência. NÃO é NEXT_PUBLIC_: aquilo é assado no build.
      FUSO_DA_PLATAFORMA: ${FUSO_DA_PLATAFORMA:-America/Sao_Paulo}
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_CDN_EXP_URL: http://localhost:5173
      # Microsoft Clarity: sem valor por default. A stack de dev roda com o
      # Clarity DESLIGADO de propósito — sessão de quem desenvolve não é sessão
      # de estudante, e misturar as duas suja o painel. Para provar a
      # integração localmente, exporte no shell antes do `pnpm docker:dev`.
      NEXT_PUBLIC_CLARITY_PROJECT_ID: ${NEXT_PUBLIC_CLARITY_PROJECT_ID:-}
      # Fora de produção e sem manifesto, o hub embeda o dev server de cada exp
      # (mapa de portas em lib/experiencias-dev.ts) — endereços do BROWSER. Já a
      # leitura do `experiencia.json` (que decide o aparelho/viewport) é
      # server-side: de dentro do container, `localhost:5173` seria o próprio
      # container. `EXP_INTERNAL_HOST` troca só o HOST e preserva a porta, então
      # cada exp continua lendo o SEU manifesto (um `EXP_INTERNAL_URL` fixo
      # apontaria as três para o mesmo arquivo).
      EXP_INTERNAL_HOST: host.docker.internal
      HUB_ORIGIN: http://localhost:3000
      # Quem emite o PERFIL PORTÁTIL. Sem isto a rota não emite: um documento
      # cujo emissor não se identifica não vale nada na rede de destino, que
      # precisa dele para procurar o JWKS e para dizer de quem veio.
      CONTRATO_ID: ${CONTRATO_ID:-contrato-dev}
      CONTRATO_NOME: ${CONTRATO_NOME:-Rede de Demonstração}
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-com-mais-de-32-caracteres-ok}
      AUTH_TRUST_HOST: "true"
      # Vazia = par RS256 efêmero (regenera a cada restart, invalidando tokens
      # antigos). Vem do .env da raiz; em produção, do Secret Manager.
      TOKEN_SIGNING_KEY_PEM: ${TOKEN_SIGNING_KEY_PEM:-}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  # ── Experiências (dev servers do Vite) ──────────────────────────────────────
  # `--strictPort` porque a porta é contrato com o hub: sem ele o Vite pula para
  # a próxima livre e o iframe passa a apontar para a experiência errada.
  exp08ef1b:
    <<: *dev
    working_dir: /repo/apps/experiencias/exp08ef1b
    command: pnpm exec vite --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "5173:5173"
    depends_on:
      deps:
        condition: service_completed_successfully

  # 5174, a porta do UnooTube, que o arquivamento deixou para o Jornal (ADR-116).
  # O backup não roda em dev: ninguém joga uma experiência arquivada.
  exp04ef1b:
    <<: *dev
    working_dir: /repo/apps/experiencias/exp04ef1b
    command: pnpm exec vite --host 0.0.0.0 --port 5174 --strictPort
    ports:
      - "5174:5174"
    depends_on:
      deps:
        condition: service_completed_successfully

  app-90:
    <<: *dev
    working_dir: /repo/apps/experiencias/app-90-plano-de-aula
    command: pnpm exec vite --host 0.0.0.0 --port 5175 --strictPort
    ports:
      - "5175:5175"
    depends_on:
      deps:
        condition: service_completed_successfully

  app-70:
    <<: *dev
    working_dir: /repo/apps/experiencias/app-70-vila-do-lume
    command: pnpm exec vite --host 0.0.0.0 --port 5177 --strictPort
    ports:
      - "5177:5177"
    # Faltava, e só apareceu quando o volume `nm-app70` nasceu vazio na troca
    # de código (ADR-110): sem esperar o `deps`, o Vite sobe antes do install
    # e morre com "Command vite not found".
    depends_on:
      deps:
        condition: service_completed_successfully
  app-91:
    <<: *dev
    working_dir: /repo/apps/experiencias/app-91-bem-estar
    command: pnpm exec vite --host 0.0.0.0 --port 5176 --strictPort
    ports:
      - "5176:5176"
    depends_on:
      deps:
        condition: service_completed_successfully

  app-92:
    <<: *dev
    working_dir: /repo/apps/experiencias/app-92-plano-de-ensino
    command: pnpm exec vite --host 0.0.0.0 --port 5180 --strictPort
    ports:
      - "5180:5180"
    depends_on:
      deps:
        condition: service_completed_successfully

  exp02em1b:
    <<: *dev
    working_dir: /repo/apps/experiencias/exp02em1b
    command: pnpm exec vite --host 0.0.0.0 --port 5178 --strictPort
    ports:
      - "5178:5178"
    depends_on:
      deps:
        condition: service_completed_successfully

  # A Missão Tempestade, versão anterior (ADR-181): fora do catálogo, mas no ar.
  # Fica num profile para não pesar na VM do Docker quando ninguém a usa.
  exp02em1b-v0:
    <<: *dev
    profiles: ["anteriores"]
    working_dir: /repo/apps/experiencias/exp02em1b-v0
    command: pnpm exec vite --host 0.0.0.0 --port 5186 --strictPort
    ports:
      - "5186:5186"
    depends_on:
      deps:
        condition: service_completed_successfully

  exp07ef1b:
    <<: *dev
    working_dir: /repo/apps/experiencias/exp07ef1b
    command: pnpm exec vite --host 0.0.0.0 --port 5179 --strictPort
    ports:
      - "5179:5179"
    depends_on:
      deps:
        condition: service_completed_successfully

  # 5181, e não 5180: a 5180 está reservada para o planejamento de ensino.
  exp06ef2b:
    <<: *dev
    working_dir: /repo/apps/experiencias/exp06ef2b
    command: pnpm exec vite --host 0.0.0.0 --port 5181 --strictPort
    ports:
      - "5181:5181"
    depends_on:
      deps:
        condition: service_completed_successfully

  exp08ef4b:
    <<: *dev
    working_dir: /repo/apps/experiencias/exp08ef4b
    command: pnpm exec vite --host 0.0.0.0 --port 5182 --strictPort
    ports:
      - "5182:5182"
