name: sonda
# A suíte de ponta a ponta como MONITOR SINTÉTICO (cap. 17): `publico` +
# `estudante` contra o ambiente, a cada 30 min em horário escolar (6h–20h em
# Brasília = 9h–23h UTC), dias úteis. Fora do código da suíte — ela já sai com
# exit code honesto e relatório classificado; o que faltava era alguém ligá-la.
#
# Roda contra DEV pelo agendamento, e não contra hml como o cap. 17 desenhou:
# um workflow agendado sempre executa na branch padrão (dev), e o environment
# de hml só aceita job vindo da branch hml (deployment branch policy). Abrir a
# policy enfraqueceria a trava que protege a identidade WIF de hml. Contra hml,
# dispare manualmente A PARTIR da branch hml (workflow_dispatch).
on:
  schedule:
    - cron: "*/30 9-23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: sonda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonda:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prd' || github.ref_name }}
    env:
      HUB_URL: ${{ vars.HUB_ORIGIN }}
      SENHA_DEMO: ${{ secrets.SENHA_DEMO }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # A ordem é a canônica: o estudante PRODUZ o estado que as telas do
      # professor leem. Aqui só os dois primeiros papéis — leitura + o que uma
      # conta de sonda pode escrever sem sujar a administração.
      - name: publico
        run: node scripts/e2e/rodar.mjs publico
      - name: estudante
        run: node scripts/e2e/rodar.mjs estudante
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sonda-${{ github.ref_name }}-${{ github.run_number }}
          path: testes/
          retention-days: 7
      # Uma falha isolada é ruído de rede; a política do cap. 17 alerta em DUAS
      # seguidas — quem decide isso é o alerta do Cloud Monitoring sobre o
      # resultado. Aqui só se avisa no canal "amanhã", se houver.
      - name: Avisar no canal
        if: failure()
        env:
          WEBHOOK: ${{ secrets.ALERTA_WEBHOOK }}
          MSG: "sonda ${{ github.ref_name }} em vermelho (run #${{ github.run_number }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::sem ALERTA_WEBHOOK — $MSG"; exit 0; fi
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$(jq -cn --arg t "$MSG" '{text:$t}')" "$WEBHOOK"
