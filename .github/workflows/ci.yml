name: ci
on:
  # So os PRs para as branches de ambiente em nuvem: dev, hml e, quando
  # producao existir, main. PR para dev-local (ou para outra branch de
  # trabalho) NAO roda: ali o portao e o `pnpm turbo typecheck lint test` da
  # Definition of Done, e a promocao dev-local -> dev verifica tudo o que
  # acumulou (ADR-121). A cota do plano Free acabou em 2026-09 e levou o
  # deploy junto.
  pull_request:
    branches: [dev, hml, main]
  # Chamado pelo deploy.yml no push para dev/hml. NAO tem `push` proprio:
  # rodaria duas vezes no mesmo commit, e o deploy precisa ESPERAR por ele —
  # dois workflows em paralelo deixariam um teste vermelho subir para escola.
  workflow_call:
    inputs:
      completo:
        description: "Verificar TODOS os pacotes, nao so os alterados desde HEAD^"
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest

    # 9 das 23 suites da api sao de INTEGRACAO: exercitam RLS, advisory lock e
    # ON CONFLICT, que sao justamente as coisas que um mock nao testa. Sem um
    # Postgres aqui elas nao rodam, e o portao vira decoracao.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: unooria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d unooria"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:pass@localhost:5432/unooria

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }

      # O `postinstall` da api roda o `prisma generate` aqui. Sem ele, o
      # `@prisma/client` nao exporta nada e a api nao compila — foi o que
      # derrubou o primeiro deploy, com 365 erros de tipo.
      - run: pnpm install --frozen-lockfile

      # `apps/agente-professor` é Python: lint, typecheck e test passam pelo
      # `uv`. Sem ele no runner o pacote FALHA de propósito (scripts/uv.mjs) —
      # um pacote que some da verificação sem avisar seria um verde falso.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: apps/agente-professor/uv.lock

      - name: Schema no banco de teste
        run: pnpm --filter @edu/api migrate:deploy

      # O escopo TEM que acompanhar o do deploy. Com `forcar`, o deploy builda
      # tudo; se a verificacao continuasse filtrando por `...[HEAD^]`, ela
      # passaria sem exercitar o pacote que quebra — foi o que aconteceu no
      # primeiro deploy: o portao ficou verde em 36s sem compilar a api.
      # `--concurrency=2`: com a concorrência padrão do turbo (10), uma mudança
      # que toca quase o monorepo inteiro (subir o design system recompila 14
      # experiências, a api e o hub) esgota o runner. Na promoção #228 o
      # `verify` caiu três vezes: um teste do hub estourou o tempo e, nas duas
      # seguintes, o runner foi desligado no meio dos builds (código 137).
      - name: Verificar
        env:
          COMPLETO: ${{ inputs.completo }}
        run: |
          if [ "$COMPLETO" = "true" ]; then
            pnpm turbo typecheck lint test build --concurrency=2
          else
            pnpm turbo typecheck lint test build --filter='...[HEAD^]' --concurrency=2
          fi

      # Trava de vulnerabilidade: high ou critical em dependencia = portao
      # vermelho. Sempre o workspace INTEIRO (o lockfile e um so — nao ha
      # "dependencia que nao mudou"). O que exige major de framework esta
      # ignorado com PRAZO no .snyk de apps/api: expirou sem o upgrade, este
      # passo volta a falhar sozinho — o prazo com a rotina que o cumpre.
      # Sem SNYK_TOKEN o passo falha alto, nunca pula.
      #
      # O --exclude e OBRIGATORIO aqui: este passo roda DEPOIS do build, e o
      # --all-projects acharia os package.json de dentro de .next/dist (o
      # standalone do hub carrega copias que nao sao dependencia de ninguem).
      # O --dev tambem: sem ele o snyk pula devDependencies, e foi por ai que
      # um CRITICAL no vitest passou verde na primeira semana da trava.
      # - name: Snyk (trava em high)
      #   env:
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      #   run: |
      #     npm install -g snyk
      #     snyk test --all-projects --dev --severity-threshold=high \
      #       --exclude=.next,.next-prod,dist,build,storage,storage-privado,jogo
