name: deploy
# Fluxo por ambiente: PR de branch de trabalho -> dev, PR de dev -> hml
# (e, quando produção existir, PR de hml -> main). O push que o merge do PR
# gera é o que dispara este workflow; a branch diz QUAL stack recebe.
on:
  push: { branches: [dev, hml] }   # main entra aqui quando virar produção
  workflow_dispatch:
    inputs:
      forcar:
        description: "Publicar tudo, ignorando o diff (primeiro deploy, ou re-run depois de falha)"
        type: boolean
        default: false

# Dois deploys ao mesmo tempo brigam pela mesma revisao do Cloud Run e pelo
# mesmo banco. `cancel-in-progress: false` de proposito: abortar no meio de uma
# migration deixa schema e imagem fora de sincronia — melhor enfileirar.
# O grupo carrega a ref: deploy de dev e de hml NAO se enfileiram entre si —
# são stacks GCP separadas.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Tudo que muda de um ambiente para outro entra por `vars` de ENVIRONMENT do
# GitHub (Settings > Environments > dev|hml), nunca por vars de repositório —
# o workflow nao sabe o nome de nenhum recurso. Os valores saem de
# `terraform output` do workspace correspondente; use
# scripts/configurar-github-ci.sh, que escreve no environment certo.
#
# NAO ha bloco `env:` no nivel do workflow de proposito: vars de environment
# so resolvem DENTRO de um job que declara `environment:` — no nivel do
# workflow elas chegariam vazias (ou, pior, com o valor de repositório de
# outro ambiente). Cada job de deploy declara o environment e as suas envs.
jobs:
  # Portao: typecheck + lint + test. Nada sobe se isto falhar.
  verificar:
    uses: ./.github/workflows/ci.yml
    # `forcar` builda tudo no deploy — a verificacao precisa cobrir o mesmo.
    with:
      completo: ${{ inputs.forcar == true }}
    # Workflow chamado NAO herda secrets: sem isto o SNYK_TOKEN chega vazio
    # so no push para dev/hml (no PR o ci.yml roda direto e recebe) — o passo
    # do Snyk falhava com SNYK-0005 exatamente onde o deploy depende dele.
    secrets: inherit

  # O diff decide QUAIS jobs rodam. Um job proprio (e nao um passo repetido em
  # cada job) para o criterio ser calculado UMA vez — api, hub e experiencias
  # lendo o mesmo commit de referencia.
  mudancas:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.mudou.outputs.api }}
      hub: ${{ steps.mudou.outputs.hub }}
      exps: ${{ steps.mudou.outputs.exps }}
    steps:
      # Guarda do workflow_dispatch: disparado de uma branch que nao e de
      # ambiente, nada pode subir — e referenciar um environment inexistente
      # o CRIARIA em silencio, com todas as vars vazias.
      - name: Guarda de ambiente
        run: |
          case "$GITHUB_REF_NAME" in
            dev|hml) ;;   # main entra aqui quando virar produção
            *) echo "::error::deploy só roda de dev ou hml (ref atual: $GITHUB_REF_NAME)"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      # `HEAD^` e o PRIMEIRO PAI: num merge commit de PR, e a ponta antiga da
      # branch de ambiente — o diff cobre o PR inteiro. Isso vale para merge
      # commit e para squash; um REBASE-merge quebraria o criterio (HEAD^
      # passaria a ser o penultimo commit do PR). Rebase fica desabilitado
      # nas opcoes de merge do repositorio.
      - name: O que mudou neste push
        id: mudou
        env:
          FORCAR: ${{ inputs.forcar }}
        run: |
          mudou() {
            if [ "$FORCAR" = "true" ]; then echo true; return; fi
            git diff --quiet HEAD^ HEAD -- "$@" && echo false || echo true
          }
          # O lockfile entra nos TRES: override de dependencia na raiz muda o
          # que qualquer app embarca, sem tocar arquivo dentro dele.
          {
            echo "api=$(mudou apps/api packages pnpm-lock.yaml)"
            echo "hub=$(mudou apps/hub packages pnpm-lock.yaml)"
            echo "exps=$(mudou apps/experiencias packages pnpm-lock.yaml)"
          } >> "$GITHUB_OUTPUT"

  # --- api: imagem -> migrations -> serviço ---------------------------------
  # A ORDEM importa: o schema novo tem que estar no banco antes que a revisão
  # nova comece a receber tráfego, senão a api roda contra um banco velho.
  # api e hub sao jobs SEPARADOS de proposito: as imagens nao dependem uma da
  # outra, e em serie eram os dois passos mais caros do deploy.
  deploy-api:
    needs: [verificar, mudancas]
    if: needs.mudancas.outputs.api == 'true'
    runs-on: ubuntu-latest
    # branch = environment (main -> prd, quando existir). O environment traz
    # as vars da stack certa e trava por deployment branch policy: o de hml
    # so aceita deploy vindo da branch hml.
    environment: ${{ github.ref_name == 'main' && 'prd' || github.ref_name }}
    permissions: { contents: read, id-token: write }   # WIF, sem chave JSON
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.REGION }}
      API_SERVICE: ${{ vars.API_SERVICE }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB }}
      API_URL: ${{ vars.API_URL }}
      IMG: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.AR_REPO }}/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3

      # Push direto para o Artifact Registry: nada de Cloud Build no meio (uma
      # API e um conjunto de permissoes a menos, e o build fica no runner).
      - name: Autenticar o Docker no Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      # A imagem builda do zero la dentro (o Dockerfile tem a camada de deps
      # cacheavel via type=gha) — este job nao precisa de pnpm no runner.
      # O escopo do cache carrega o ambiente: a imagem e a mesma, mas dev e
      # hml nao devem invalidar o cache um do outro a cada push alternado.
      - name: Imagem da api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMG }}
          # Sem cache, cada imagem refaz o `pnpm install` inteiro: ~10 min.
          cache-from: type=gha,scope=api-${{ github.ref_name }}
          cache-to: type=gha,scope=api-${{ github.ref_name }},mode=max

      # O job roda DENTRO da VPC — é o único caminho até o Postgres, que só tem
      # IP privado. `--wait` faz o passo falhar se a migration falhar.
      #
      # Roda em TODO deploy da api, e não só quando `prisma/migrations` muda:
      # `migrate deploy` aplica o que falta e é no-op quando não falta nada. A
      # condição por diff parecia economia e criava um buraco — num banco novo
      # TODAS as migrations estão pendentes, e nenhum commit "mudou migrations".
      # O deploy passava verde com o banco vazio, e a api subia contra um schema
      # que não existia.
      - name: Rodar as migrations (Cloud Run Job)
        run: |
          gcloud run jobs update "$MIGRATE_JOB" \
            --image "$IMG" --region "$REGION" --project "$GCP_PROJECT"
          gcloud run jobs execute "$MIGRATE_JOB" \
            --region "$REGION" --project "$GCP_PROJECT" --wait

      - name: Deploy da api
        run: |
          gcloud run deploy "$API_SERVICE" \
            --image "$IMG" --region "$REGION" --project "$GCP_PROJECT"

      # O `gcloud run deploy` volta quando a revisão RECEBE tráfego, não quando
      # ela responde. A sonda pergunta à revisão nova, pelo domínio público, se
      # o banco está atrás dela (`/readyz` = processo + SELECT 1). Falhou em 2
      # minutos = job vermelho, e o `ativar-exps` não ativa nada (cap. 17).
      - name: Sonda pós-deploy
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$API_URL/readyz" | grep -q '"ok":true'; then
              echo "api responde em $API_URL/readyz"; exit 0
            fi
            sleep 10
          done
          echo "::error::a api não respondeu {\"ok\":true} em $API_URL/readyz em 2 minutos"
          exit 1

  # --- hub ------------------------------------------------------------------
  deploy-hub:
    needs: [verificar, mudancas]
    if: needs.mudancas.outputs.hub == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prd' || github.ref_name }}
    permissions: { contents: read, id-token: write }
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.REGION }}
      HUB_SERVICE: ${{ vars.HUB_SERVICE }}
      HUB_ORIGIN: ${{ vars.HUB_ORIGIN }}
      IMG: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.AR_REPO }}/hub:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3

      - name: Autenticar o Docker no Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      # O SHA CURTO, e nao o `github.sha` inteiro: `NEXT_PUBLIC_HUB_VERSAO` vira
      # o campo `versao` de todo erro de cliente do hub, e o schema da api o
      # limita (o SHA de 40 caracteres estourava `max(32)` e TODO erro voltava
      # 400 — a captura ficou morta de 2026-09-02 a 2026-09-08 sem ninguem ver,
      # porque local o default do Dockerfile e "dev", com tres). O mesmo valor
      # e o `service.version` do lote OTLP do hub, que o proxy valida com
      # `{1,32}`: com o SHA inteiro o lote era descartado e a rota respondia
      # 204. Expressao do GitHub nao tem substring, entao o corte vem daqui.
      - name: Versao do hub (SHA curto)
        id: versao
        run: echo "curto=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Imagem do hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hub/Dockerfile
          push: true
          tags: ${{ env.IMG }}
          # Microsoft Clarity (ADR-60). `NEXT_PUBLIC_*` é inlinada no bundle do
          # client durante o `next build`, então o valor tem de entrar na
          # IMAGEM — pôr no Cloud Run depois não altera um bundle compilado.
          # `vars.CLARITY_PROJECT_ID` é do environment (dev/hml/prd) e só
          # resolve dentro deste job, que declara `environment:`. Ausente, a
          # var vem vazia e o hub sobe com o Clarity desligado.
          build-args: |
            NEXT_PUBLIC_CLARITY_PROJECT_ID=${{ vars.CLARITY_PROJECT_ID }}
            NEXT_PUBLIC_HUB_VERSAO=${{ steps.versao.outputs.curto }}
          cache-from: type=gha,scope=hub-${{ github.ref_name }}
          cache-to: type=gha,scope=hub-${{ github.ref_name }},mode=max

      - name: Deploy do hub
        run: |
          gcloud run deploy "$HUB_SERVICE" \
            --image "$IMG" --region "$REGION" --project "$GCP_PROJECT"

      # Duas provas, pelo domínio público: o processo responde (`/api/healthz`)
      # e a chave de assinatura está carregada (`/.well-known/jwks.json` com
      # "keys") — sem a segunda, nenhum token de experiência é validável e o
      # `ativar-exps` falharia com um 401 que não aponta para a causa.
      - name: Sonda pós-deploy
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$HUB_ORIGIN/api/healthz" | grep -q '"ok":true' \
               && curl -fsS --max-time 10 "$HUB_ORIGIN/.well-known/jwks.json" | grep -q '"keys"'; then
              echo "hub responde e serve o JWKS em $HUB_ORIGIN"; exit 0
            fi
            sleep 10
          done
          echo "::error::o hub não respondeu (healthz + jwks) em $HUB_ORIGIN em 2 minutos"
          exit 1

  # --- experiências: dist -> bucket versionado + manifesto ------------------
  # SOBE o bundle; não o ativa. O caminho carrega a versão
  # (`{expId}/{versao}/`), então subir bundle NOVO não muda nada do que o hub
  # serve — quem decide isso é `experiencias.versaoAtiva`, escrita no job
  # `ativar-exps`. Por isso este job NÃO espera o hub: o upload é inerte, e
  # adiantá-lo encurta a janela em que o hub novo conviveria com o bundle velho.
  #
  # A consequência de NÃO subir a versão do `experiencia.json` é este job
  # sobrescrever um caminho que o comentário do `rsync` abaixo declara imutável:
  # a borda e o navegador de quem está no meio de uma sessão guardam os assets
  # daquela versão, e `--delete-unmatched-destination-objects` acabou de apagar
  # os que eles vão pedir. Versão nova = caminho novo = nada a sobrescrever.
  publicar-exps:
    needs: [verificar, mudancas]
    if: >-
      !cancelled() &&
      needs.verificar.result == 'success' &&
      needs.mudancas.outputs.exps == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prd' || github.ref_name }}
    permissions: { contents: read, id-token: write }
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      EXP_BUCKET: ${{ vars.EXP_BUCKET }}
      ASSETS_BUCKET: ${{ vars.ASSETS_BUCKET }}
      # Bucket PRIVADO dos sourcemaps (`terraform output bucket_exp_mapas`).
      EXP_MAPAS_BUCKET: ${{ vars.EXP_MAPAS_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      # O `postinstall` da api roda o `prisma generate` aqui — sem ele o
      # turbo build dos pacotes que dependem da api quebraria.
      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # Mídia pesada (52 MB de mp4 da exp-02) não entra no bundle: o build
          # aponta para o bucket de assets. Vazio = ./videos (dev).
          VITE_VIDEOS_BASE_URL: ${{ vars.ASSETS_BASE_URL }}/exp-02-unootube/videos
          FORCAR: ${{ inputs.forcar }}
        # Com `forcar`, o laço de publicação percorre TODAS as experiências —
        # então o build também precisa ser de todas, senão falta o `dist/`.
        run: |
          if [ "$FORCAR" = "true" ]; then
            pnpm turbo build
          else
            pnpm turbo build --filter='...[HEAD^]'
          fi

      - name: Subir bundles das experiências alteradas
        env:
          FORCAR: ${{ inputs.forcar }}
        run: |
          set -euo pipefail
          for dir in apps/experiencias/*/; do
            exp=$(basename "$dir")
            if [ "$exp" = "_template" ]; then continue; fi
            # Pasta de experiencia ainda incompleta (sem package.json, sem
            # manifesto, ou nao buildada) nao e erro de deploy — e trabalho em
            # andamento. Publicar exige as tres coisas.
            if [ ! -f "$dir/package.json" ] || [ ! -f "$dir/public/experiencia.json" ]; then
              echo "· $exp sem package.json/manifesto — pulando"; continue
            fi
            if [ ! -d "$dir/dist" ]; then
              echo "· $exp sem dist — pulando"; continue
            fi
            if [ "$FORCAR" != "true" ] && git diff --quiet HEAD^ HEAD -- "$dir" packages/sdk pnpm-lock.yaml; then continue; fi
            # A versão sai do MANIFESTO, não do package.json: é o
            # `experiencia.json` que o `publicar-manifesto.mjs` lê para gravar
            # `versaoAtiva`. Lendo de fontes diferentes elas divergem — a
            # exp-02 subiu para `.../1.0.0/` (package.json) enquanto o manifesto
            # registrava `1.1.0`, e o hub montaria a URL de uma versão que não
            # existe no bucket.
            ver=$(node -p "require('./$dir/public/experiencia.json').versao")

            # Midia pesada (>2 MB) NAO entra no git nem no bundle: ela mora no
            # bucket de assets e o upload e deliberado, uma vez por contrato —
            # o runner nao tem os arquivos para sincronizar. O que o CI pode
            # fazer, e passou a fazer, e SE RECUSAR a publicar sem eles.
            #
            # O custo de nao ter isso ja foi pago: a exp-02 subiu num contrato
            # novo com o bucket de assets vazio, os 21 mp4 responderam 404, e o
            # feed ficou em "Carregando o video..." para sempre — com Salvar e
            # Curtir desabilitados junto, o que tornava a missao impossivel de
            # concluir. Nada falhou em lugar nenhum: nem o deploy, nem o log da
            # api. Quem descobriu foi um estudante, na frente da tela.
            if [ -f "$dir/midia-externa.json" ]; then
              if [ -z "${ASSETS_BUCKET:-}" ]; then
                echo "::warning::$exp declara midia externa, mas a var ASSETS_BUCKET nao existe neste environment. Rode scripts/configurar-github-ci.sh para a conferencia voltar a valer."
              else
                prefixo=$(node -p "require('./$dir/midia-externa.json').prefixo")
                esperados=$(node -p "require('./$dir/midia-externa.json').arquivos.join('\n')")
                presentes=$(gcloud storage ls "gs://$ASSETS_BUCKET/$prefixo/" --project "$GCP_PROJECT" 2>/dev/null | sed 's#.*/##' || true)
                faltando=$(comm -23 <(echo "$esperados" | sort) <(echo "$presentes" | sort))
                if [ -n "$faltando" ]; then
                  echo "::error::$exp: a midia externa nao esta em gs://$ASSETS_BUCKET/$prefixo/ — publicar assim entrega uma missao que o estudante nao consegue terminar."
                  echo "Faltando:"; echo "$faltando" | sed 's/^/  · /'
                  echo "Suba com: gcloud storage rsync -r $dir/public/videos gs://$ASSETS_BUCKET/$prefixo/ --project $GCP_PROJECT"
                  exit 1
                fi
                echo "· $exp: midia externa conferida em gs://$ASSETS_BUCKET/$prefixo/"
              fi
            fi

            # `--exclude` vale para ORIGEM e DESTINO: nenhum `.map` sobe para o
            # bucket público, e nenhum que exista lá é apagado. O bucket dos
            # bundles tem acesso uniforme — qualquer objeto nele é público, e o
            # sourcemap é o fonte (na exp-01, a revelação legível antes da hora).
            gcloud storage rsync -r "$dir/dist" "gs://$EXP_BUCKET/$exp/$ver/" \
              --delete-unmatched-destination-objects --exclude='.*\.map$' --project "$GCP_PROJECT"

            # Os mapas vão para o bucket PRIVADO, no mesmo caminho versionado:
            # quem traduz a stack de um erro de cliente (scripts/mapear-stack.mjs)
            # acha o mapa da versão exata. Sem a var, aviso — não falha: o
            # bundle continua íntegro, só a stack fica minificada.
            if compgen -G "$dir/dist/assets/*.map" > /dev/null; then
              if [ -z "${EXP_MAPAS_BUCKET:-}" ]; then
                echo "::warning::$exp gerou sourcemaps, mas a var EXP_MAPAS_BUCKET nao existe neste environment (terraform output bucket_exp_mapas + scripts/configurar-github-ci.sh). Os .map ficaram so no runner."
              else
                gcloud storage cp "$dir"/dist/assets/*.map "gs://$EXP_MAPAS_BUCKET/$exp/$ver/assets/" --project "$GCP_PROJECT"
                echo "· $exp: sourcemaps em gs://$EXP_MAPAS_BUCKET/$exp/$ver/assets/"
              fi
            fi

            # O caminho carrega a versão, então o bundle é imutável e pode
            # ficar um ano na borda. O index.html é o ponteiro: cache curto,
            # senão um rollback de `versaoAtiva` demora a aparecer.
            gcloud storage objects update "gs://$EXP_BUCKET/$exp/$ver/index.html" \
              --cache-control="public, max-age=60" --project "$GCP_PROJECT"

            echo "bundle no ar, inerte até a ativação: $exp@$ver"
          done

  # A CHAVE DE VIRADA. O PUT do manifesto (`experiencias.versaoAtiva`) é o que
  # faz o hub montar a URL da versão nova — antes dele, o bundle novo está no
  # bucket sem ninguém pedindo por ele.
  #
  # Depois do hub e da api de propósito, e isto não é otimização: a api valida
  # este PUT contra o JWKS que o HUB serve. Hub fora do ar = manifesto
  # rejeitado. Como o bundle já subiu no job anterior, a janela em que o hub
  # novo convive com o bundle antigo cai do build inteiro das experiências para
  # a duração deste PUT.
  #
  # `!cancelled()` + `!= 'failure'` porque os deploys podem ter sido PULADOS
  # (push que só mudou experiência) — pulado não pode bloquear a ativação.
  ativar-exps:
    needs: [verificar, mudancas, publicar-exps, deploy-api, deploy-hub]
    if: >-
      !cancelled() &&
      needs.verificar.result == 'success' &&
      needs.mudancas.outputs.exps == 'true' &&
      needs.publicar-exps.result == 'success' &&
      needs.deploy-api.result != 'failure' &&
      needs.deploy-hub.result != 'failure'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prd' || github.ref_name }}
    permissions: { contents: read, id-token: write }
    steps:
      # Sem BUILD, mas o `pnpm install` é obrigatório: o script assina o token
      # de admin-contrato com `jose` (dependência do hub), e sem ele o job morre
      # em `ERR_MODULE_NOT_FOUND` — depois de os bundles já terem subido, com a
      # `versaoAtiva` ainda apontando para a versão antiga. O install é FILTRADO
      # no hub: é a única dependência que o script precisa, e instalar o
      # workspace inteiro aqui pagaria o `prisma generate` da api sem uso.
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @edu/hub

      - name: Ativar as versões novas no manifesto
        env:
          API_URL: ${{ vars.API_URL }}
          HUB_ORIGIN: ${{ vars.HUB_ORIGIN }}
          TOKEN_SIGNING_KEY_PEM: ${{ secrets.TOKEN_SIGNING_KEY_PEM }}   # Secret Manager `{prefix}-token-signing-key`, escopado no environment
          FORCAR: ${{ inputs.forcar }}
        run: |
          set -euo pipefail
          for dir in apps/experiencias/*/; do
            exp=$(basename "$dir")
            if [ "$exp" = "_template" ]; then continue; fi
            if [ ! -f "$dir/package.json" ] || [ ! -f "$dir/public/experiencia.json" ]; then
              echo "· $exp sem package.json/manifesto — pulando"; continue
            fi
            # MESMO filtro do job de upload: ativar o que não subiu apontaria a
            # `versaoAtiva` para um caminho que não existe no bucket.
            if [ "$FORCAR" != "true" ] && git diff --quiet HEAD^ HEAD -- "$dir" packages/sdk pnpm-lock.yaml; then continue; fi
            ver=$(node -p "require('./$dir/public/experiencia.json').versao")
            node apps/hub/scripts/publicar-manifesto.mjs "$dir"
            echo "ativada $exp@$ver"
          done

  # O canário mais barato que existe (scripts/e2e/AGENTS.md): a suíte da
  # landing abre o hub de verdade, com a lógica de espera que corre contra o
  # erro. Roda DEPOIS de tudo estar no ar; só a 01 (landing), que não faz login
  # — sem senha de demonstração no CI. Falhou = job vermelho, e o GitHub avisa
  # por e-mail quem fez o push (comportamento padrão de workflow que falha).
  # As suítes que escrevem (estudante, professor) continuam sendo do operador.
  smoke:
    needs: [verificar, mudancas, deploy-api, deploy-hub, publicar-exps, ativar-exps]
    if: >-
      !cancelled() &&
      needs.verificar.result == 'success' &&
      needs.deploy-api.result != 'failure' &&
      needs.deploy-hub.result != 'failure' &&
      needs.publicar-exps.result != 'failure' &&
      needs.ativar-exps.result != 'failure'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prd' || github.ref_name }}
    env:
      HUB_URL: ${{ vars.HUB_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `pnpm exec`, nunca `npx`: o npx resolve o playwright mais NOVO do npm e
      # baixa o navegador dele, não o da versão fixada no repo (AGENTS.md).
      - run: pnpm exec playwright install --with-deps chromium
      - name: Landing contra o ambiente recém-publicado
        run: node scripts/e2e/rodar.mjs publico/01
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-${{ github.ref_name }}-${{ github.run_number }}
          path: testes/
          retention-days: 7
