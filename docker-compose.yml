# Plataforma Unooria — banco + api + hub, em containers.
#
#   docker compose up -d --build
#
# Sobe:
#   - pg    Postgres da plataforma (5432, banco `unooria`)
#   - api   NestJS (3001) — migrations e seed rodam sozinhos no primeiro up
#   - hub   Next.js (3000)
#
# O IdP (WSO2) é OUTRO compose, de propósito: é um gerenciador central de
# identidade, compartilhado entre contratos e com ciclo de vida próprio (mesmo
# desenho de produção — docs/INFRA-IDENTITY.md). Para subir só ele:
#
#   docker compose -f wso2/docker-compose.yml up -d
#
# Enquanto o WSO2 não é o emissor, o próprio hub assina os tokens de
# experiência (RS256) e serve o JWKS em /.well-known/jwks.json.
#
# As EXPERIÊNCIAS não entram aqui: em produção são bundles estáticos num
# bucket, não serviços. Em dev, rode à parte (portas em apps/hub/lib/experiencias-dev.ts):
#   pnpm --filter @edu/exp-01-instanooria dev     # :5173
#   pnpm --filter @edu/exp-02-unootube dev        # :5174
name: unooria-plataforma

services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: unooria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U postgres -d unooria"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Migrations + seed antes da api subir. Roda até o fim e sai; o
  # `service_completed_successfully` da api espera por ele. Idempotente: pode
  # rodar em todo `up`.
  #
  # Reusa a MESMA imagem da api (só `image:`, sem `build:`) — é assim que o
  # Cloud Run Job de migration funciona em produção, e evita que um `build api`
  # deixe uma imagem de migrate velha para trás.
  migrate:
    image: unooria-plataforma-api:latest
    # Os três passos são idempotentes: `migrate deploy` só aplica o que falta,
    # e os dois seeds fazem upsert (o de demo apaga e recria a atividade DEMO).
    # `./node_modules/.bin/prisma`, não `npx prisma`: o npx buscaria a última
    # versão na REDE (baixou a 7.x e quebrou), em vez da 6.x do projeto.
    command: >
      sh -c "./node_modules/.bin/prisma migrate deploy &&
             node dist/prisma/seed.js &&
             node dist/prisma/semear-demo.js"
    environment:
      DATABASE_URL: postgresql://postgres:pass@pg:5432/unooria
      # Senha das contas de demonstração. O seed NÃO tem default no fonte (uma
      # constante ali criaria contas com senha conhecida se ele rodasse contra
      # o banco de um contrato) — é aqui, no compose de DEV, que ela vive.
      SEED_SENHA: ${SEED_SENHA:-unooria123}
    depends_on:
      pg:
        condition: service_healthy
    restart: "no"

  api:
    image: unooria-plataforma-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:pass@pg:5432/unooria
      # O emissor dos tokens é o HUB. Dentro da rede do compose a api alcança
      # o hub pelo nome do serviço; o `issuer` precisa ser o mesmo valor que o
      # hub grava no token (a origem que o BROWSER usa).
      OIDC_ISSUER: http://localhost:3000
      OIDC_JWKS_URI: http://hub:3000/.well-known/jwks.json
      OIDC_AUDIENCE: plataforma-api
      # IA por ADC: aqui a credencial vem do arquivo montado abaixo; em Cloud
      # Run, da service account do serviço (mesma cadeia, sem env nenhuma).
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      VERTEX_MODEL: ${VERTEX_MODEL:-gemini-3.6-flash}
      VERTEX_MODEL_LONGO: ${VERTEX_MODEL_LONGO:-gemini-3.6-flash}
      VERTEX_IMAGE_MODEL: ${VERTEX_IMAGE_MODEL:-gemini-3.1-flash-image}
      VERTEX_THINKING_BUDGET: ${VERTEX_THINKING_BUDGET:-0}
      GOOGLE_APPLICATION_CREDENTIALS: /adc/application_default_credentials.json
      # 300k por estudante/dia: uma partida completa da exp-03 custa ~77k tokens
      # (MEDIDO, ver `unoogpt/regras/defaults.ts`), e "Recomeçar" abre partida
      # nova. 20000 era o teto do tutor da exp-01 e matava a missao no 4o turno.
      AI_DAILY_TOKEN_QUOTA_PER_ESTUDANTE: ${AI_DAILY_TOKEN_QUOTA_PER_ESTUDANTE:-300000}
      AI_DAILY_TOKEN_QUOTA_PER_PROFESSOR: ${AI_DAILY_TOKEN_QUOTA_PER_PROFESSOR:-2000000}
      ASSETS_DRIVER: local
      ASSETS_LOCAL_DIR: /app/storage
      ASSETS_PUBLIC_URL: http://localhost:3001/assets
      TELEMETRIA_TOPIC: ""
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5182
      # O FUSO da plataforma inteira (ADR-99). Ausente = America/Sao_Paulo.
      # O MESMO valor vai para o hub abaixo: 1 contrato = 1 stack, e api e hub
      # que discordem do fuso devolvem o defeito da ADR-98 — entre as 21h e a
      # meia-noite os dois renderizam DIAS diferentes. Aqui um valor inválido
      # derruba o boot (Zod, `config/env.ts`); no hub ele cai no padrão.
      FUSO_DA_PLATAFORMA: ${FUSO_DA_PLATAFORMA:-America/Sao_Paulo}
      # Documentação OpenAPI em http://localhost:3001/docs (Swagger UI).
      #
      # LIGADA por default em dev, com credencial de dev à vista: sem as duas
      # variáveis a rota nem é montada, e um /docs que só funciona para quem
      # descobriu que precisa exportar env é um /docs que ninguém abre. Em
      # produção estas variáveis vêm do Secret Manager (docs/INFRA.md) e a senha
      # NÃO é esta — o boot exige 16 caracteres, e as duas andam juntas.
      SWAGGER_USUARIO: ${SWAGGER_USUARIO:-docs}
      SWAGGER_SENHA: ${SWAGGER_SENHA:-unooria-docs-local}
      PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      # Imagens geradas sobrevivem ao recreate do container.
      - assets:/app/storage
      # ADC do host (somente leitura): este compose roda a IMAGEM de produção
      # na máquina, onde não há metadata server. Em Cloud Run o arquivo não
      # existe e a lib cai sozinha na service account do serviço.
      - ${ADC_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}:/adc/application_default_credentials.json:ro
    depends_on:
      pg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  hub:
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
    environment:
      # `API_INTERNAL_URL` é server-side (rede do compose); `NEXT_PUBLIC_API_URL`
      # vai para o BROWSER e precisa ser alcançável de fora.
      API_INTERNAL_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_CDN_EXP_URL: ${CDN_EXP_URL:-http://localhost:5173}
      # Server-side: de onde o hub LÊ o `experiencia.json` do bundle (o
      # `viewport` que decide o aparelho). O endereço público acima é o do
      # browser — dentro do container `localhost` é o container.
      EXP_INTERNAL_URL: ${EXP_INTERNAL_URL:-http://host.docker.internal:5173}
      HUB_ORIGIN: http://localhost:3000
      # O mesmo fuso da api (ADR-99). O hub o escreve num <meta> do layout raiz
      # e de lá ele chega ao navegador e, pelo config do hub:init, a toda
      # experiência. NÃO é NEXT_PUBLIC_: aquilo é assado no build.
      FUSO_DA_PLATAFORMA: ${FUSO_DA_PLATAFORMA:-America/Sao_Paulo}
      # Emissor do PERFIL PORTÁTIL — sem ele a emissão responde 503.
      CONTRATO_ID: ${CONTRATO_ID:-contrato-dev}
      CONTRATO_NOME: ${CONTRATO_NOME:-Rede de Demonstração}
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-com-mais-de-32-caracteres-ok}
      AUTH_TRUST_HOST: "true"
      # Vazia em dev = par RS256 efêmero (regenera a cada restart do container,
      # invalidando tokens antigos). Em produção vem do Secret Manager.
      TOKEN_SIGNING_KEY_PEM: ${TOKEN_SIGNING_KEY_PEM:-}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  assets:
