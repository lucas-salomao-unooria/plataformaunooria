<!doctype html>
<html lang="pt-BR" data-unc-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      O cromo é o do APP CLONADO, não o da missão: o estudante acha que abriu um
      mensageiro, e é essa premissa que a missão mede. A aba é onde o disfarce
      cai primeiro — inclusive no DevTools, que a criança de 10 anos abre por
      curiosidade (ADR-60). Nada aqui pode denunciar o exercício.

      O mensageiro é o Unoochat (ADR-134), no tema CLARO, escrito aqui na raiz
      (`data-unc-theme`) e não só herdado do `:root` da folha: quem ler o HTML
      sabe o tema sem abrir o pacote. `#FFFFFF` é o `--unc-color-surface-canvas`
      claro, o fundo da barra do aparelho — outra cor daria uma faixa no topo
      antes de a folha do DS carregar.
    -->
    <meta name="theme-color" content="#FFFFFF" />
    <title>Conversas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
