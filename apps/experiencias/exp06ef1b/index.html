<!doctype html>
<!--
  `data-unv-theme="light"` na raiz: os componentes do Unoovista não têm tema
  padrão e herdam o do contêiner ancestral, e o clone desta missão é o
  Unoovista claro. A consulta nos Stories declara o próprio tema (escuro).
-->
<html lang="pt-BR" data-unv-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Nome neutro de app: nada aqui pode denunciar o exercício (a mesma regra da exp08ef1b). -->
    <meta name="theme-color" content="#FFFFFF" />
    <title>Unoovista</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
