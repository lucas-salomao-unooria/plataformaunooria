<!doctype html>
<!--
  `data-insta-theme="light"` na raiz: o CSS da seção troca os tokens do `:root`
  para o escuro quando o sistema operacional está em modo escuro, e o clone
  desta missão é o Instagram claro. Os componentes escuros (o Story, o
  compositor) declaram o próprio tema e não são afetados.
-->
<html lang="pt-BR" data-insta-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Nome neutro de app: nada aqui pode denunciar o exercício (a mesma regra da exp08ef1b). -->
    <meta name="theme-color" content="#FFFFFF" />
    <title>Instanooria</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
